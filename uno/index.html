<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-left">
                <a href="/" class="global-hub-btn">🏠</a>
                <h1 id="ui-title">UNO</h1>
            </div>
            <select id="langPicker"><option value="en">English</option><option value="tr">Türkçe</option></select>
        </header>

        <div id="screen-setup" class="screen active card">
            <h2 id="ui-setup">Setup Game</h2>
            <div class="stepper">
                <label id="ui-players">Players: </label>
                <button onclick="changeP(-1)">-</button><span id="val-p">2</span><button onclick="changeP(1)">+</button>
            </div>
            <div class="tabs"><button class="active">Local Pass-Phone</button><button disabled>Online (Coming Soon)</button></div>
            <button id="btn-start" class="btn" onclick="initGame()">Start</button>
            <button id="btn-del" class="btn danger" onclick="resetDB()" style="margin-top:10px">Delete Data</button>
        </div>

        <div id="screen-pass" class="screen card center">
            <h2 id="ui-pass-msg">Player 1 Turn</h2>
            <button id="btn-show-cards" class="btn" onclick="showGame()">Tap to show cards</button>
        </div>

        <div id="screen-game" class="screen">
            <div class="table-area">
                <div class="deck" onclick="drawCard()"><div class="card-back">UNO</div></div>
                <div id="discard-pile" class="discard"></div>
            </div>
            <div class="status-row">
                <span id="ui-turn-info">Player 1's Turn</span>
                <button id="btn-uno" class="btn danger small" onclick="callUno()">UNO!</button>
            </div>
            <div id="player-hand" class="hand-area"></div>
            <button id="btn-end-turn" class="btn" onclick="endTurn()" style="display:none; margin-top:10px">End Turn</button>
        </div>
    </div>
    
    <button id="btn-rules" class="fab-rules" onclick="document.getElementById('rulesModal').style.display='flex'">?</button>
    <div id="rulesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('rulesModal').style.display='none'">&times;</span>
            <h2 id="ui-rules-title">Rules</h2><div id="rules-text"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
