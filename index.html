<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Merkezi | Çağan Çalıdağ</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --text-color: #e94560;
            --text-light: #fff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem; }
        header { text-align: center; margin-bottom: 3rem; }
        header h1 { font-size: 2.5rem; color: var(--text-color); margin-bottom: 0.5rem; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; width: 100%; max-width: 1000px; }
        .game-card { background-color: var(--card-bg); border-radius: 12px; padding: 2rem; text-align: center; text-decoration: none; color: inherit; transition: transform 0.3s, box-shadow 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(233, 69, 96, 0.4); }
        .game-card h2 { font-size: 1.8rem; margin-bottom: 1rem; color: var(--text-color); }
        .game-card p { font-size: 1rem; opacity: 0.8; }
        .game-icon { font-size: 4rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <header>
        <h1>Oyun Merkezi</h1>
        <p>Klasik oyunların modern web uyarlamaları</p>
    </header>
    <div class="grid-container">
        <a href="tavla/index.html" class="game-card">
            <div class="game-icon">🎲</div>
            <h2>Tavla</h2>
            <p>Erkek ve Kız Tavlası. Çevrimdışı, 2 kişilik.</p>
        </a>
        <a href="#" class="game-card" style="opacity: 0.6; cursor: not-allowed;">
            <div class="game-icon">♟️</div>
            <h2>Satranç</h2>
            <p>Çok yakında...</p>
        </a>
        <a href="#" class="game-card" style="opacity: 0.6; cursor: not-allowed;">
            <div class="game-icon">🏁</div>
            <h2>Dama</h2>
            <p>Çok yakında...</p>
        </a>
    </div>
</body>
</html>
