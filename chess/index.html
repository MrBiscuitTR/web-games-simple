<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="keywords" content="chess, play chess online, free chess, satranç, satranç oyna, ücretsiz satranç, 2 player chess, offline chess, browser chess, board game">
    <meta name="author" content="Çağan Çalıdağ">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="canonical" href="https://games.cagancalidag.com/chess/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Game Hub">
    <meta property="og:title" content="Chess — Play Free Online, No Ads">
    <meta property="og:description" content="Classic two-player chess in your browser. Undo, move history, offline support. No ads, no sign-up.">
    <meta property="og:url" content="https://games.cagancalidag.com/chess/">
    <meta property="og:image" content="https://games.cagancalidag.com/favicon.png">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="tr_TR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Chess — Play Free Online, No Ads">
    <meta name="twitter:description" content="Classic two-player chess in your browser. No ads, no sign-up, works offline.">
    <meta name="twitter:image" content="https://games.cagancalidag.com/favicon.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Chess",
      "alternateName": "Satranç",
      "url": "https://games.cagancalidag.com/chess/",
      "image": "https://games.cagancalidag.com/favicon.png",
      "description": "Free classic chess for two players on one device, with undo and move history. Entertainment only — no stakes and no real-money play.",
      "inLanguage": ["en", "tr"],
      "genre": ["Board Game", "Strategy"],
      "gamePlatform": "Web Browser",
      "playMode": "MultiPlayer",
      "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 2, "maxValue": 2 },
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "isFamilyFriendly": true,
      "isAccessibleForFree": true,
      "author": { "@type": "Person", "name": "Çağan Çalıdağ" },
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "availability": "https://schema.org/InStock" }
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-left">
                <a href="/" class="global-hub-btn">🏠</a>
                <h1 id="ui-title">Chess</h1>
            </div>
            <select id="langPicker"><option value="en">English</option><option value="tr">Türkçe</option></select>
        </header>

        <details class="mobile-details" id="settingsDetails">
            <summary id="ui-controls">Controls & Settings</summary>
            <div class="control-panel">
                <button id="btn-undo" class="btn">Undo Move</button>
                <button id="btn-new" class="btn">New Game</button>
                <button id="btn-del" class="btn danger">Delete Data</button>
                <button id="btn-rules" class="btn icon">?</button>
            </div>
        </details>

        <div id="status-bar" class="status-bar">White to move</div>
        
        <div class="board-wrapper" style="position: relative;">
            <div id="board" class="chessboard"></div>
            <div id="game-over-overlay" class="game-over-overlay"></div>
        </div>

        <details class="mobile-details">
            <summary id="ui-history">Move History</summary>
            <div id="history-log" class="history-log"></div>
        </details>
    </div>

    <div id="promoModal" class="modal">
        <div class="modal-content">
            <h2 id="ui-promo-title">Promote Pawn</h2>
            <div class="promo-pieces" id="promo-options"></div>
        </div>
    </div>
    <div id="rulesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('rulesModal').style.display='none'">&times;</span>
            <h2 id="ui-rules-title">Rules</h2>
            <div id="rules-text"></div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="/sw-register.js"></script>
</body>
</html>
