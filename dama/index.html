<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkers &amp; Turkish Dama — Play Free, No Ads | Dama Oyna Ücretsiz</title>
    <meta name="description" content="Play Turkish Dama and International Checkers free in your browser. Two players on one device, undo moves, works offline. No ads, no downloads. | Ücretsiz dama oyna: Türk daması ve uluslararası dama, reklamsız, çevrimdışı.">
    <meta name="keywords" content="dama, dama oyna, türk daması, ücretsiz dama, checkers, draughts, international checkers, turkish checkers, 2 player checkers, offline board game">
    <meta name="author" content="Çağan Çalıdağ">
    <meta name="robots" content="index, follow, max-image-preview:large">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="canonical" href="https://games.cagancalidag.com/dama/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Game Hub">
    <meta property="og:title" content="Checkers &amp; Turkish Dama — Play Free, No Ads">
    <meta property="og:description" content="Turkish Dama and International Checkers for two players in your browser. Undo, offline support, no ads.">
    <meta property="og:url" content="https://games.cagancalidag.com/dama/">
    <meta property="og:image" content="https://games.cagancalidag.com/favicon.png">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="tr_TR">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Checkers &amp; Turkish Dama — Play Free, No Ads">
    <meta name="twitter:description" content="Turkish Dama and International Checkers for two players. No ads, works offline.">
    <meta name="twitter:image" content="https://games.cagancalidag.com/favicon.png">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Checkers",
      "alternateName": ["Dama", "Türk Daması", "Draughts"],
      "url": "https://games.cagancalidag.com/dama/",
      "image": "https://games.cagancalidag.com/favicon.png",
      "description": "Free Turkish Dama and International Checkers for two players on one device. Entertainment only — no stakes and no real-money play.",
      "inLanguage": ["en", "tr"],
      "genre": ["Board Game", "Strategy"],
      "gamePlatform": "Web Browser",
      "playMode": "MultiPlayer",
      "numberOfPlayers": { "@type": "QuantitativeValue", "minValue": 2, "maxValue": 2 },
      "applicationCategory": "GameApplication",
      "operatingSystem": "Any",
      "isFamilyFriendly": true,
      "isAccessibleForFree": true,
      "author": { "@type": "Person", "name": "Çağan Çalıdağ" },
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "availability": "https://schema.org/InStock" }
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-left">
                <a href="/" class="global-hub-btn">🏠</a>
                <h1 id="ui-title">Checkers</h1>
            </div>
            <select id="langPicker"><option value="en">English</option><option value="tr">Türkçe</option></select>
        </header>

        <details class="mobile-details" id="settingsDetails">
            <summary id="ui-controls">Settings & Controls</summary>
            <div class="control-panel">
                <div class="tabs">
                    <button id="tab-tr" class="active" onclick="switchMode('tr')">Turkish Dama</button>
                    <button id="tab-int" onclick="switchMode('int')">International</button>
                </div>
                <div style="display:flex; gap:10px; width:100%;">
                    <button id="btn-undo" class="btn">Undo Move</button>
                    <button id="btn-new" class="btn">New Game</button>
                    <button id="btn-del" class="btn danger">Delete Data</button>
                </div>
            </div>
        </details>

        <div id="status-bar" class="status-bar">White to move</div>
        
        <div class="board-wrapper" style="position: relative;">
            <div id="board" class="board"></div>
            <div id="game-over-overlay" class="game-over-overlay"></div>
        </div>
        
        <button id="btn-rules" class="fab-rules" onclick="document.getElementById('rulesModal').style.display='flex'">?</button>
    </div>

    <div id="rulesModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="document.getElementById('rulesModal').style.display='none'">&times;</span>
            <h2 id="ui-rules-title">Rules</h2>
            <div id="rules-text"></div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="/sw-register.js"></script>
</body>
</html>
